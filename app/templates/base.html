<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Real Life Index{% endblock %}</title>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>

  <style>
    /* Thin scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #09090f; }
    ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a50; }

    a { text-decoration: none; }

    /* Tabular numbers for prices */
    .price-num {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #ffffff 0%, #9ca3af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Card glow on hover */
    .card-glow:hover {
      box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 8px 32px rgba(0,0,0,0.45);
    }

    /* Fade-up entrance */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.45s cubic-bezier(0.16,1,0.3,1) both; }

    /* Ambient top glow */
    .top-glow {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 400px;
      background: radial-gradient(ellipse at center top, rgba(99,102,241,0.07) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="bg-[#09090f] text-white min-h-screen flex flex-col font-sans antialiased">

  <!-- Ambient glow -->
  <div class="top-glow"></div>

  <!-- Navigation bar -->
  <nav class="border-b border-white/[0.06] sticky top-0 z-50 backdrop-blur-md" style="background: rgba(9,9,15,0.85);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">

      <!-- Brand -->
      <a href="/" class="flex items-center gap-2.5 text-white hover:text-white/80 transition-colors">
        <div class="w-7 h-7 rounded-lg flex items-center justify-center flex-shrink-0"
             style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); box-shadow: 0 0 16px rgba(99,102,241,0.35);">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
            <polyline points="17 6 23 6 23 12"/>
          </svg>
        </div>
        <span class="font-bold text-[15px] tracking-tight">Real Life Index</span>
      </a>

      <!-- Right side nav -->
      <div class="flex items-center gap-3">
        <a href="/compare"
           class="hidden sm:flex items-center gap-1.5 text-xs font-medium text-zinc-400 hover:text-white transition-colors px-3 py-1.5 rounded-lg hover:bg-white/[0.06]">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 20V10M12 20V4M6 20v-6"/>
          </svg>
          Compare 🇺🇸 vs 🇮🇪
        </a>
        <div class="hidden sm:flex items-center gap-1.5 text-xs text-zinc-500 bg-white/[0.04] border border-white/[0.07] rounded-full px-3 py-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          Price Tracker
        </div>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 pb-16 w-full flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="relative z-10 border-t border-white/[0.06] mt-auto" style="background: rgba(9,9,15,0.95);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5 flex flex-col sm:flex-row items-center justify-between gap-3">

      <div class="flex items-center gap-2 text-xs text-zinc-600">
        <div class="w-5 h-5 rounded-md flex items-center justify-center"
             style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-2.5 h-2.5 text-white" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
            <polyline points="17 6 23 6 23 12"/>
          </svg>
        </div>
        <span class="font-medium text-zinc-500">Real Life Index</span>
      </div>

      <p class="text-xs text-zinc-600 text-center">
        Data:
        <a href="https://www.bls.gov/developers/" target="_blank" rel="noopener"
           class="text-zinc-500 hover:text-indigo-400 transition-colors">BLS</a>
        <span class="mx-1.5 text-zinc-800">·</span>
        <a href="https://www.eia.gov/opendata/" target="_blank" rel="noopener"
           class="text-zinc-500 hover:text-indigo-400 transition-colors">EIA</a>
        <span class="mx-1.5 text-zinc-800">·</span>
        Lidl IE
        <span class="mx-1.5 text-zinc-800">·</span>
        AA Ireland
        <span class="mx-1.5 text-zinc-800">·</span>
        Manually maintained prices
      </p>

      <p class="text-xs text-zinc-700">For informational purposes only.</p>
    </div>
  </footer>

</body>
</html>

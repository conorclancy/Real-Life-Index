<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Real Life Index{% endblock %}</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- Navigation bar -->
  <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 font-bold text-xl text-slate-800 hover:text-blue-600 transition-colors no-underline">
        🛒 <span>Real Life Index</span>
      </a>
      <span class="text-sm text-slate-400 hidden sm:block">US Everyday Price Tracker</span>
    </div>
  </nav>

  <!-- Main content area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 pb-16 w-full flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 text-center text-xs text-slate-400 leading-relaxed">
      <p>
        Data sources:
        <a href="https://www.bls.gov/developers/" target="_blank" rel="noopener" class="text-blue-500 hover:underline">BLS Average Retail Prices API</a> ·
        <a href="https://www.eia.gov/opendata/" target="_blank" rel="noopener" class="text-blue-500 hover:underline">EIA Open Data</a> ·
        McDonald's &amp; Netflix prices manually maintained.
      </p>
      <p class="mt-1">Updated monthly (grocery) and weekly (gasoline). For informational purposes only.</p>
    </div>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Real Life Index{% endblock %}</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
          },
          colors: {
            dark: {
              bg:      '#0c0c10',
              surface: '#13131a',
              card:    '#1a1a24',
              hover:   '#21212e',
              border:  'rgba(255,255,255,0.07)',
            }
          }
        }
      }
    }
  </script>

  <!-- Plotly.js -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" defer></script>

  <style>
    /* Thin scrollbar for dark theme */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #13131a; }
    ::-webkit-scrollbar-thumb { background: #2d2d3e; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3d3d55; }
    a { text-decoration: none; }
  </style>
</head>
<body class="bg-[#0c0c10] text-white min-h-screen flex flex-col font-sans antialiased">

  <!-- Navigation bar -->
  <nav class="bg-[#13131a] border-b border-white/[0.07] sticky top-0 z-50 backdrop-blur-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 font-bold text-lg text-white hover:text-blue-400 transition-colors">
        🛒 <span>Real Life Index</span>
      </a>
      <div class="flex items-center gap-3">
        <span class="hidden sm:flex items-center gap-1.5 text-xs text-zinc-500">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          US Everyday Price Tracker
        </span>
      </div>
    </div>
  </nav>

  <!-- Main content area -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 pb-16 w-full flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-[#13131a] border-t border-white/[0.07] mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5 text-center text-xs text-zinc-600 leading-relaxed">
      <p>
        Data sources:
        <a href="https://www.bls.gov/developers/" target="_blank" rel="noopener" class="text-zinc-500 hover:text-blue-400 transition-colors">BLS Average Retail Prices API</a>
        <span class="mx-1.5 text-zinc-700">·</span>
        <a href="https://www.eia.gov/opendata/" target="_blank" rel="noopener" class="text-zinc-500 hover:text-blue-400 transition-colors">EIA Open Data</a>
        <span class="mx-1.5 text-zinc-700">·</span>
        McDonald's &amp; Netflix prices manually maintained.
      </p>
      <p class="mt-1 text-zinc-700">Updated monthly (grocery) and weekly (gasoline). For informational purposes only.</p>
    </div>
  </footer>

</body>
</html>
